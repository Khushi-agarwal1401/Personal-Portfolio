<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#a78bfa">
    <meta name="robots" content="noindex">
    <title>Message Sent — Thank You | Khushi Agarwal</title>

    <!-- Apply saved/system theme before first paint (avoids flash of wrong theme) -->
    <script src="./src/scripts/theme-init.js"></script>

    <!-- Render Blocking CSS optimizations & Font Display -->
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" media="print" onload="this.media='all'">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>

    <link rel="stylesheet" href="./src/styles/style.css">
</head>
<body class="thank-you-page">

    <button class="theme-toggle thank-you-toggle" aria-label="Switch to dark mode" aria-pressed="false">
        <i class="bi bi-moon-stars"></i>
        <i class="bi bi-sun"></i>
    </button>

    <div class="thank-you-container">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h1 class="thank-you-heading heading">Thanks for Reaching Out!</h1>
        <p class="thank-you-text">Your message has been sent successfully. I appreciate your interest and will respond as soon as possible.</p>
        <a href="./index.html" class="return-btn magnetic">
            <i class="bi bi-arrow-left"></i> Return to Homepage
        </a>
    </div>

    <script src="./src/scripts/script.js"></script>
</body>
</html>
